title: "[Proposal] "
labels:
  - proposal
body:
  - type: markdown
    attributes:
      value: |
        Use this template to propose a new principle, pattern, stack choice, or governance change.
        See [Governance](/the-shrine/reference/governance/) for the full lifecycle.

  - type: dropdown
    id: type
    attributes:
      label: Proposal Type
      options:
        - Principle
        - Pattern
        - Stack Choice
        - Governance Change
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: The Proposal
      description: One sentence. What are you proposing?
      placeholder: "We should adopt X because Y."
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why This Matters
      description: What goes wrong without it? Cite real examples if possible.
      placeholder: |
        Without this:
        - Risk A happens
        - We saw this in Project X when...
    validations:
      required: true

  - type: textarea
    id: questions
    attributes:
      label: Open Questions
      description: What needs refinement before this solidifies? Leave blank if none.
      placeholder: |
        1. Should this apply to client projects or just internal?
        2. How do we measure compliance?
    validations:
      required: false

  - type: textarea
    id: prior-art
    attributes:
      label: Prior Art
      description: Links to related patterns, external references, or internal docs.
      placeholder: |
        - Similar to Google's X principle
        - See internal doc at...
    validations:
      required: false

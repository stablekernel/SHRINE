title: ""
labels:
  - proposal
body:
  - type: markdown
    attributes:
      value: |
        Use this template to propose a new principle, pattern, stack choice, or governance change.
        See [Governance](https://stablekernel.github.io/SHRINE/reference/governance/) for the full lifecycle.

  - type: checkboxes
    id: self-filter
    attributes:
      label: Self-Assessment
      description: Confirm you've considered these before proposing.
      options:
        - label: I've considered the maintainability of this proposal
          required: false
        - label: I've considered the impact of accepting it
          required: false
        - label: This isn't already covered elsewhere
          required: false
        - label: I can demonstrate this with a real example
          required: false
        - label: I would follow this myself
          required: false
        - label: This scales across teams and clients
          required: false
        - label: This is the right altitude (principle vs pattern vs stack)
          required: false

  - type: dropdown
    id: type
    attributes:
      label: Proposal Type
      options:
        - Principle
        - Pattern
        - Stack Choice
        - Governance Change
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: The Proposal
      description: One sentence. What are you proposing?
      placeholder: "We should adopt X because Y."
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why This Matters
      description: What goes wrong without it? Cite real examples if possible.
      placeholder: |
        Without this:
        - Risk A happens
        - We saw this in Project X when...
    validations:
      required: true

  - type: textarea
    id: questions
    attributes:
      label: Open Questions
      description: What needs refinement before this solidifies? Leave blank if none.
      placeholder: |
        1. Should this apply to client projects or just internal?
        2. How do we measure compliance?
    validations:
      required: false

  - type: textarea
    id: prior-art
    attributes:
      label: Prior Art
      description: Links to related patterns, external references, or internal docs.
      placeholder: |
        - Similar to Google's X principle
        - See internal doc at...
    validations:
      required: false

  - type: input
    id: pr
    attributes:
      label: Documentation PR
      description: Link to the draft PR with the docs update. Add this once the proposal is refined.
      placeholder: "https://github.com/stablekernel/SHRINE/pull/..."
    validations:
      required: false

name: Inspect

on:
  pull_request:
    paths:
      - 'inspect/**'
      - 'docs/src/content/docs/**'
      - '.github/workflows/inspect.yml'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # A hung test fails the job instead of holding a runner for hours.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: inspect
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: inspect/package-lock.json

      - name: Install dev dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  visual:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    # Same image (and Playwright version) that made the committed *-linux.png
    # baselines, so fonts and browser match and a pixel diff gates.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    defaults:
      run:
        working-directory: inspect
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: inspect/package-lock.json

      - name: Install dev dependencies
        run: npm ci

      - name: Visual and a11y
        run: npm run test:visual

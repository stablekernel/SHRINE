name: Inspect

on:
  pull_request:
    paths:
      - 'inspect/**'
      - 'docs/src/content/docs/**'
      - '.github/workflows/inspect.yml'
      - '.github/workflows/inspect-release.yml'
      - 'LICENSE'
      - 'NOTICE'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # A hung test fails the job instead of holding a runner for hours.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: inspect
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: inspect/package-lock.json

      - name: Install dev dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  # Release dry run: build the tarball, install it into a clean HOME, run a
  # background T1 with a stand-in judge (no model call), then the read-only hash
  # check and the share-safe leak check. Node 20 is required here.
  dry-run:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: inspect
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Release dry run
        run: node scripts/dry-run.mjs --dir "$RUNNER_TEMP/dry-run" --require-node20

      - name: Keep the transcript and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/dry-run/transcript.txt
            ${{ runner.temp }}/dry-run/**/report.share-safe.html
          if-no-files-found: ignore

  visual:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    # Same image (and Playwright version) that made the committed *-linux.png
    # baselines, so fonts and browser match and a pixel diff gates.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    defaults:
      run:
        working-directory: inspect
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: inspect/package-lock.json

      - name: Install dev dependencies
        run: npm ci

      - name: Visual and a11y
        run: npm run test:visual
